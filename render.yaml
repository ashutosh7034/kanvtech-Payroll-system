# Render Blueprint Specification for PAYFLOW
# Architecture: Backend Web Service + Frontend Static Site + Managed PostgreSQL Database
services:
  # --------------------------------------------------------------------------
  # 1. PAYFLOW Backend API (Node.js Express + Prisma ORM)
  # --------------------------------------------------------------------------
  - type: web
    name: payflow-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: payflow-postgres
          property: connectionString
      - key: CORS_ORIGIN
        value: https://kanvtech-payroll-system.vercel.app,https://payflow-frontend.onrender.com,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h

  # --------------------------------------------------------------------------
  # 2. PAYFLOW Frontend SPA (React + TypeScript + Vite)
  # --------------------------------------------------------------------------
  - type: web
    name: payflow-frontend
    runtime: static
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://payflow-backend.onrender.com/api/v1

# ----------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ----------------------------------------------------------------------------
databases:
  - name: payflow-postgres
    plan: starter
    databaseName: payroll_management
    user: payflow
